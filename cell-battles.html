var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var CELL = 8;
var RED = 1, BLUE = 2, EMPTY = 0;
var COLORS = { [RED]: '#ff6b6b', [BLUE]: '#74b9ff' };
var BEATS = { [RED]: BLUE, [BLUE]: RED };
var FIGHT_P = 0.031;
var cols, rows, grid, next;

function resize() {
  var oldGrid = grid, oldCols = cols, oldRows = rows;
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  cols = Math.floor(canvas.width / CELL);
  rows = Math.floor(canvas.height / CELL);
  grid = new Uint8Array(cols * rows);
  next = new Uint8Array(cols * rows);
  if (oldGrid) {
    var cr = Math.min(oldRows, rows), cc = Math.min(oldCols, cols);
    for (var y = 0; y < cr; y++)
      for (var x = 0; x < cc; x++)
        grid[y * cols + x] = oldGrid[y * oldCols + x];
  } else {
    randomize();
  }
}
resize();
window.addEventListener('resize', resize);

function idx(x, y) { return y * cols + x; }
function randomize() {
  for (var y = 0; y < rows; y++)
    for (var x = 0; x < cols; x++)
      grid[idx(x, y)] = x < cols / 2 ? RED : BLUE;
}

function step() {
  for (var y = 0; y < rows; y++) {
    for (var x = 0; x < cols; x++) {
      var i = idx(x, y);
      var me = grid[i];
      var counts = [0, 0, 0, 0];
      for (var dy = -1; dy <= 1; dy++) {
        var ny = y + dy;
        if (ny < 0 || ny >= rows) continue;
        for (var dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0) continue;
          var nx = x + dx;
          if (nx < 0 || nx >= cols) continue;
          counts[grid[idx(nx, ny)]]++;
        }
      }
      if (me === EMPTY) {
        var total = counts[RED] + counts[BLUE];
        next[i] = total > 0 && Math.random() < 0.7 ? argmaxCount(counts) : EMPTY;
      } else {
        var k = counts[RED] * (BEATS[RED] === me) + counts[BLUE] * (BEATS[BLUE] === me);
        if (k > 0 && Math.random() < 1 - Math.pow(1 - FIGHT_P, k)) {
          var a = counts[RED] * (BEATS[RED] === me);
          var b = counts[BLUE] * (BEATS[BLUE] === me);
          next[i] = Math.random() * (a + b) < a ? RED : BLUE;
        } else {
          next[i] = me;
        }
      }
    }
  }
  var tmp = grid; grid = next; next = tmp;
}

function argmaxCount(counts) {
  var a = counts[RED], b = counts[BLUE];
  var best = Math.max(a, b);
  var cands = [];
  if (a === best) cands.push(RED);
  if (b === best) cands.push(BLUE);
  return cands[Math.floor(Math.random() * cands.length)];
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (var y = 0; y < rows; y++) {
    for (var x = 0; x < cols; x++) {
      var v = grid[idx(x, y)];
      if (v === EMPTY) continue;
      ctx.fillStyle = COLORS[v];
      ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }
  }
}

var acc = 0, last = performance.now();
function frame(now) {
  var rawDt = Math.min(0.05, (now - last) / 1000);
  last = now;
  acc += rawDt * 2;
  var steps = 0;
  while (acc >= 1 / 60 && steps < 60) { step(); acc -= 1 / 60; steps++; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
