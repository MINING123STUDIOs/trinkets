var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W, H;
var dt = 0.015;
// Physics uses SI units: 1 m rods, 1 kg masses. ROD is the drawing scale, so
// the screen size never changes how fast the pendulum swings.
var g = 9.81, L1 = 1, L2 = 1, m1 = 1, m2 = 1;
var ROD = 120;
var hues = [200, 340];
var p = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function randomize() {
  var b1 = (Math.random() - 0.5) * Math.PI * 1.9;
  var b2 = (Math.random() - 0.5) * Math.PI * 1.9;
  p = [[b1, b2, 0, 0], [b1 + 0.001, b2, 0, 0]];
}
randomize();

canvas.addEventListener('click', randomize);

// Standard double-pendulum equations from the Lagrangian, with both angles
// measured from the downward vertical and the masses at the ends of the rods:
//
//   T = ½(m1+m2)L1²ω1² + ½m2L2²ω2² + m2 L1 L2 ω1ω2 cos(θ1−θ2)
//   V = −(m1+m2)gL1 cosθ1 − m2gL2 cosθ2
//
// These are the solved Euler–Lagrange equations (not a small-angle
// approximation); RK4 on this state conserves the total energy to round-off.
function derivs(th1, th2, o1, o2) {
  var d = th1 - th2;
  var sinD = Math.sin(d), cosD = Math.cos(d);
  var den1 = L1 * (2 * m1 + m2 - m2 * Math.cos(2 * d));
  var den2 = L2 * (2 * m1 + m2 - m2 * Math.cos(2 * d));
  var num1 = -g * (2 * m1 + m2) * Math.sin(th1)
    - m2 * g * Math.sin(th1 - 2 * th2)
    - 2 * sinD * m2 * (o2 * o2 * L2 + o1 * o1 * L1 * cosD);
  var num2 = 2 * sinD * (o1 * o1 * L1 * (m1 + m2)
    + g * (m1 + m2) * Math.cos(th1)
    + o2 * o2 * L2 * m2 * cosD);
  return [o1, o2, num1 / den1, num2 / den2];
}

function rk4(s) {
  var k1 = derivs(s[0], s[1], s[2], s[3]);
  var a = s[0]+k1[0]*dt/2, b = s[1]+k1[1]*dt/2, c = s[2]+k1[2]*dt/2, d = s[3]+k1[3]*dt/2;
  var k2 = derivs(a, b, c, d);
  a = s[0]+k2[0]*dt/2; b = s[1]+k2[1]*dt/2; c = s[2]+k2[2]*dt/2; d = s[3]+k2[3]*dt/2;
  var k3 = derivs(a, b, c, d);
  a = s[0]+k3[0]*dt; b = s[1]+k3[1]*dt; c = s[2]+k3[2]*dt; d = s[3]+k3[3]*dt;
  var k4 = derivs(a, b, c, d);
  s[0] += (k1[0]+2*k2[0]+2*k3[0]+k4[0])*dt/6;
  s[1] += (k1[1]+2*k2[1]+2*k3[1]+k4[1])*dt/6;
  s[2] += (k1[2]+2*k2[2]+2*k3[2]+k4[2])*dt/6;
  s[3] += (k1[3]+2*k2[3]+2*k3[3]+k4[3])*dt/6;
}

var lastNow = 0, acc = 0;

function loop(now) {
  requestAnimationFrame(loop);

  // Advance by elapsed wall time, not by frames: a 144 Hz screen and a
  // throttled tab must show the same swing. The 0.1 s cap stops a backgrounded
  // tab from replaying seconds of motion at once.
  if (!lastNow) lastNow = now;
  acc += Math.min((now - lastNow) / 1000, 0.1);
  lastNow = now;
  while (acc >= dt) {
    for (var i = 0; i < 2; i++) rk4(p[i]);
    acc -= dt;
  }

  var dark = document.documentElement.getAttribute('data-theme') !== 'light';
  var cx = W / 2, cy = H * 0.38;
  var sc = Math.min(W, H) / 520;
  var sL1 = ROD * sc, sL2 = ROD * sc;

  ctx.fillStyle = dark ? '#14141e' : '#f5f5f5';
  ctx.fillRect(0, 0, W, H);

  for (var i = 0; i < 2; i++) {
    var th1 = p[i][0], th2 = p[i][1];
    var hue = hues[i];
    var x1 = cx + sL1 * Math.sin(th1);
    var y1 = cy + sL1 * Math.cos(th1);
    var x2 = x1 + sL2 * Math.sin(th2);
    var y2 = y1 + sL2 * Math.cos(th2);

    ctx.strokeStyle = 'hsla(' + hue + ',45%,55%,0.85)';
    ctx.lineWidth = 2.5 * sc;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
}

requestAnimationFrame(loop);
