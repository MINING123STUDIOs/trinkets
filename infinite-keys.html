 * Separate from `loadNumber()` on purpose: the mood id is a word ("nocturne"),
 * and coercing it with `Number()` yields NaN, which used to make `setStyle()`
 * bail out and silently drop the saved style.

 * @param {string} key
 * @param {string} def

  try {
    const v = localStorage.getItem(key);
    return v === null ? def : v;
  } catch (e) {
    return def;
  }
}

/**
 * Load a persisted numeric setting, clamped to [lo, hi]. A missing key, an
 * unparsable value or unavailable storage all fall back to `def`, so a partial
 * or corrupt write can never leave the instrument silent or at 0 bpm.
 *
 * @param {string} key
 * @param {number} def
 * @param {number} lo
 * @param {number} hi
 */
function loadNumber(key, def, lo, hi) {
  let v;
  try {
    v = localStorage.getItem(key);
  } catch (e) {
    return def;
  }
  if (v === null) return def;
  v = Number(v);
  if (!isFinite(v)) return def;
  return v < lo ? lo : v > hi ? hi : v;
}

/**
 * Persist a setting to localStorage.
 * @param {string} key
 * @param {number} value
 */
function saveSetting(key, value) {
  try { localStorage.setItem(key, String(value)); } catch (e) {}
}

/**
 * One-time diagnostics read from the query string, used to attribute a frame
 * rate problem to one layer at a time. Flags compose, e.g.
 * `?perf&noblur&dpr=1`; with no query string every field is false and the page
 * behaves exactly as before. These are investigation tools, not settings.

 *   perf      show the stats overlay
 *   noblur    drop the deck's backdrop-filter only (visuals stay on)
 *   noaurora  skip the aurora render and its full-screen blit
 *   nofx      skip stars, waveform, rings and particles
 *   dpr=N     cap the canvas backing store at N device pixels per CSS pixel

  const has = (name) =>
    new RegExp("(?:^|[?&])" + name + "(?:[=&]|$)").test(search);

/**
 * Convert `#rrggbb` (or `#rgb`) to the `"r,g,b"` form used by the
 * `rgba(var(--accent-rgb), alpha)` convention in the stylesheet and canvas.
 */
function hexToRgb(hex) {
  const h = hex.replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map((c) => c + c).join("") : h, 16);
  return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`;
}

/**
 * `#rrggbb` → `{h, s, l}` with `h` in degrees and `s`/`l` in 0–1.
 * Used only for the light theme's accent derivation.
 */
function hexToHsl(hex) {
  const h = hex.replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map((c) => c + c).join("") : h, 16);
  const r = ((n >> 16) & 255) / 255;
  const g = ((n >> 8) & 255) / 255;
  const b = (n & 255) / 255;
  const max = Math.max(r, g, b);
  const min = Math.min(r, g, b);
  const l = (max + min) / 2;
  const d = max - min;
  let hue = 0;
  if (d) {
    if (max === r) hue = ((g - b) / d + (g < b ? 6 : 0)) * 60;
    else if (max === g) hue = ((b - r) / d + 2) * 60;
    else hue = ((r - g) / d + 4) * 60;
  }
  const s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
  return { h: hue, s, l };
}

/** `{h, s, l}` → `#rrggbb`. Inverse of `hexToHsl`. */
function hslToHex(h, s, l) {
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; }
  else if (h < 120) { r = x; g = c; }
  else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; }
  else if (h < 300) { r = x; b = c; }
  else { r = c; b = x; }
  const hex = (v) => Math.round((v + m) * 255).toString(16).padStart(2, "0");
  return `#${hex(r)}${hex(g)}${hex(b)}`;
}

/**
 * Every mood carries a pastel accent tuned for a black stage; the same
 * colours on white are washed out and, under `multiply`, nearly invisible.
 * Rather than hand-picking thirty light variants, clamp each accent into a
 * legible band: dark enough to read on white, saturated enough to stay
 * recognisable as its mood.
 *
 * @param {string} hex accent from `STYLES`
 * @returns {string} `#rrggbb` safe for the light stage
 */
function accentFor(hex) {
  if (!light) return hex;
  const { h, s, l } = hexToHsl(hex);
  return hslToHex(h, Math.max(s, 0.62), Math.min(l, 0.42));
}

/**
 * Paint the unfilled portion of a range input by writing a `--fill`
 * custom property. The track gradient in CSS reads it, so the coloured
 * part always follows the thumb without extra DOM.
 */
function setSliderFill(input) {
  const pct = ((input.value - input.min) / (input.max - input.min)) * 100;
  input.style.setProperty("--fill", pct + "%");
}
/* ------------------------------------------------------------------ *
 * Audio engine: a small additive piano, procedural room, tape delay
 * ------------------------------------------------------------------ */

/**
 * Harmonic amplitude tables, index 0 unused (DC). Real piano spectra are
 * not perfectly harmonic, but a handful of decaying partials plus per-note
 * detuning gets surprisingly close. `soft` is for pads and bass, `bright`
 * for synthwave, `synth` for the chiptune mood, and `bell` — odd partials
 * only — gives the music box its hollow, metallic strike.
 */
const WAVE_SPECS = {
  piano:  [0, 1, .52, .31, .18, .11, .075, .05, .035, .025, .018, .012, .009, .006, .004, .003],
  soft:   [0, 1, .33, .13, .055, .024, .014, .008, .005, .003],
  bright: [0, 1, .70, .48, .33, .24, .18, .13, .10, .075, .055, .04, .03, .022, .016, .012],
  synth:  [0, 1, .50, .36, .28, .22, .18, .15, .12, .10, .08, .07, .06, .05, .04, .03],
  bell:   [0, 1, 0, .42, 0, .22, 0, .14, 0, .095, 0, .066, 0, .046, 0, .032]
};

/**
 * Build a stereo impulse response for the convolution reverb.
 *
 * There is no audio file to ship, so the room is synthesised: filtered
 * white noise under a `(1 - t) ^ decay` envelope, plus a handful of
 * discrete early reflections. Short IRs read as a small studio; long,
 * dark ones read as a hall. `decay` controls how quickly the tail dies.
 *
 * @param {BaseAudioContext} ctx
 * @param {number} seconds length of the tail
 * @param {number} decay exponent; larger = faster decay
 * @returns {AudioBuffer} stereo impulse response
 */
function makeIR(ctx, seconds, decay) {
  const rate = ctx.sampleRate;
  const len = Math.max(1, Math.floor(rate * seconds));
  const buf = ctx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) {
    const data = buf.getChannelData(ch);
    let smooth = 0;
    for (let i = 0; i < len; i++) {
      const t = i / len;
      const env = Math.pow(1 - t, decay);
      smooth = smooth * 0.76 + (Math.random() * 2 - 1) * 0.24;
      data[i] = smooth * env;
    }
    // a few early reflections so the room has a shape
    for (let k = 0; k < 7; k++) {
      const at = Math.floor(rate * (0.012 + k * 0.019 + Math.random() * 0.01));
      if (at < len) data[at] += (Math.random() * 2 - 1) * 0.35 * Math.pow(0.72, k);
    }
  }
  return buf;
}

/**
 * Create a reusable mono white-noise buffer. Percussion and the piano's
 * hammer transient share this buffer, so only one copy is ever allocated.
 *
 * @param {BaseAudioContext} ctx
 * @param {number} seconds
 * @returns {AudioBuffer}
 */
function makeNoise(ctx, seconds) {
  const rate = ctx.sampleRate;
  const len = Math.floor(rate * seconds);
  const buf = ctx.createBuffer(1, len, rate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  return buf;
}

/**
 * Synthesise the lo-fi vinyl bed: low-level filtered noise plus rare,
 * randomly spaced crackles. It is looped at very low gain by `startVinyl`.
 * Two channels are generated independently so the noise feels wide.
 *
 * @param {BaseAudioContext} ctx
 * @returns {AudioBuffer} five-second stereo loop
 */
function makeVinylBuffer(ctx) {
  const rate = ctx.sampleRate;
  const len = Math.floor(rate * 5);
  const buf = ctx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) {
    const data = buf.getChannelData(ch);
    let smooth = 0;
    for (let i = 0; i < len; i++) {
      smooth = smooth * 0.55 + (Math.random() * 2 - 1) * 0.45;
      let v = smooth * 0.05;
      if (Math.random() < 0.00055) v += (Math.random() * 2 - 1) * 0.7; // crackle
      data[i] = v;
    }
  }
  return buf;
}

/**
 * Pre-compute the additive oscillator spectra used by every voice.
 * `PeriodicWave` turns a harmonic amplitude table into one oscillator,
 * which is far cheaper than summing a dozen sine oscillators per note.
 * The tables are deliberately static: timbre is chosen by style, while
 * velocity and the filter envelope supply the moment-to-moment colour.
 *
 * @param {BaseAudioContext} ctx
 */
function makeWaves(ctx) {
  for (const [name, amps] of Object.entries(WAVE_SPECS)) {
    const real = new Float32Array(amps.length);
    const imag = new Float32Array(amps.length);
    for (let i = 1; i < amps.length; i++) imag[i] = amps[i];
    A.waves[name] = ctx.createPeriodicWave(real, imag, { disableNormalization: false });
  }
}

/**
 * Lazily build the audio graph on the first user gesture.
 *
 * Browsers refuse to start an AudioContext before interaction, so nothing
 * is allocated on page load. The graph is intentionally simple:
 *
 *   voices -> dry -----------------------+
 *          -> reverb send -> conv -> wet +-> analyser -> master -> compressor -> out
 *          -> delay send  -> delay -> wet+
 *
 * The analyser sits before the master gain on purpose: the waveform ribbon
 * visualises the performance, not the volume slider, so turning the room down
 * does not shrink it. `drawWave()` handles the one exception — at volume zero
 * the stage is silent, so the ribbon falls back to its flat baseline.
 *
 * The compressor is the safety net for dense chords; the analyser is only
 * used to draw the faint waveform ribbon.
 *
 * @returns {AudioContext}
 */
function ensureAudio() {
  if (A.ctx) return A.ctx;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  let ctx;
  try {
    // "playback" asks the browser for a larger buffer than "interactive".
    // For a continuous generative piece, stability beats a few ms of latency.
    ctx = new Ctx({ latencyHint: "playback" });
  } catch (e) {
    ctx = new Ctx();
  }
  A.ctx = ctx;

  // Mobile OSes can interrupt or suspend the context (calls, notifications,
  // screen lock). Try to resume if it happens mid-performance, but throttle
  // attempts so a hard failure cannot turn into a resume loop.
  let lastWake = 0;
  ctx.onstatechange = () => {
    if (!S.playing || ctx.state === "running") return;
    const now = performance.now();
    if (now - lastWake < 2500) return;
    lastWake = now;
    ctx.resume().catch(() => {});
  };

  const master = ctx.createGain();
  master.gain.value = S.volume * 0.9;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16;
  comp.knee.value = 26;
  comp.ratio.value = 3.2;
  comp.attack.value = 0.004;
  comp.release.value = 0.26;
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.82;

  // Everything is summed into the analyser first, then the master applies the
  // volume / pause fade, then the compressor catches peaks. That order is what
  // keeps the ribbon level independent of the volume slider.
  analyser.connect(master);
  master.connect(comp);
  comp.connect(ctx.destination);
  A.master = master;
  A.analyser = analyser;
  A.waveData = new Float32Array(analyser.fftSize);

  const dry = ctx.createGain();
  dry.gain.value = 1;
  dry.connect(analyser);
  A.dry = dry;

  const conv = ctx.createConvolver();
  conv.normalize = true;
  const smallScreen = window.innerWidth < 760;
  // Keep a reference to the impulse response: re-assigning it to `buffer`
  // resets the convolver's internal state, which is how pause flushes the
  // reverb tail (see `flushTails`).
  const irBuffer = makeIR(ctx, smallScreen ? 1.9 : 2.8, smallScreen ? 2.8 : 2.3);
  conv.buffer = irBuffer;
  A.conv = conv;
  A.irBuffer = irBuffer;
  const reverbWet = ctx.createGain();
  reverbWet.gain.value = 0.35;
  conv.connect(reverbWet);
  reverbWet.connect(analyser);
  const reverbSend = ctx.createGain();
  reverbSend.gain.value = 1;
  reverbSend.connect(conv);
  A.reverbWet = reverbWet;
  A.reverbSend = reverbSend;

  const delayWet = ctx.createGain();
  delayWet.gain.value = 0.16;
  delayWet.connect(analyser);
  const delaySend = ctx.createGain();
  delaySend.gain.value = 1;
  A.delayWet = delayWet;
  A.delaySend = delaySend;
  buildDelayLine();

  A.noise = makeNoise(ctx, 2);
  A.vinylBuf = makeVinylBuffer(ctx);
  makeWaves(ctx);
  // Nothing is sounding yet, so there is no echo to bend; set the style's
  // delay time directly instead of gliding up from the 0.32 s default.
  updateSpace(true);
  return ctx;
}

/**
 * Translate the Space slider and the current style into reverb/delay send
 * levels. The style supplies a base amount (a nocturne wants less room than
 * an ambient piece); the slider scales it without ever letting the wet
 * signal overpower the dry piano.
 *
 * @param {boolean} [instant] set the delay time without a glide. Resuming from
 *   pause must use this: ramping a DelayNode's `delayTime` resamples its
 *   buffer, which pitch-bends every echo already inside it (the "tape warble"
 *   heard right after unpausing). A mood change still glides, because there
 *   the bend is part of the transition and the master is dipped anyway.
 */
function updateSpace(instant) {
  if (!A.ctx) return;
  const st = S.style || {};
  const now = A.ctx.currentTime;
  const wet = clamp((0.025 + S.space * 0.9) * (0.3 + (st.reverb || 0.4) * 0.95), 0, 0.95);
  A.reverbWet.gain.setTargetAtTime(wet, now, 0.08);
  const dw = clamp((st.delay || 0) * (0.35 + S.space * 1.1), 0, 0.62);
  A.delayWet.gain.setTargetAtTime(dw, now, 0.08);
  if (st.delayTime) {
    if (instant) A.delay.delayTime.setValueAtTime(st.delayTime, now);
    else A.delay.delayTime.setTargetAtTime(st.delayTime, now, 0.2);
  }
}

/**
 * Remember a playing source so `stopAllVoices()` can silence it on pause.
 * The `onended` hook releases the reference *and* disconnects the node chain,
 * keeping the graph bounded no matter how long the piece runs. Without the
 * disconnect, a finished source's gain/filter/send nodes stay reachable from
 * the buses and accumulate over an hours-long session.
 *
 * @param {AudioScheduledSourceNode} src
 * @param {...AudioNode} nodes nodes to disconnect when the source ends
 */
function trackSource(src, ...nodes) {
  A.sources.add(src);
  src.onended = () => {
    A.sources.delete(src);
    for (const node of nodes) {
      if (!node) continue;
      try { node.disconnect(); } catch (e) {}
    }
  };
}

/**
 * Schedule one piano-ish note.
 *
 * Each note uses two slightly detuned oscillators sharing one filter and
 * amplitude envelope. The detune produces the slow beating of real unison
 * strings; the lowpass opens with velocity and closes over the note's life,
 * which is most of what makes a synth read as "piano" rather than "organ".
 *
 * Envelopes use exponential ramps (never to exactly zero) to avoid clicks.
 * A short band-passed noise burst stands in for the hammer on accented
 * notes. Long, soft attacks are selected by pad voices through `opts`.
 *
 * @param {number} midi note number (60 = middle C)
 * @param {number} when AudioContext time to start
 * @param {number} durBeats audible duration in beats
 * @param {number} vel 0..1 velocity (also drives brightness)
 * @param {object} [opts] timbre, level, attack, release, sustain, detune, pan
 */
function playVoice(midi, when, durBeats, vel, opts = {}) {
  if (!A.ctx) return;
  const ctx = A.ctx;
  const t = Math.max(when, ctx.currentTime + 0.003);
  const spb = 60 / Math.max(30, S.bpm);
  const dur = Math.max(0.09, durBeats * spb);
  const f = mtof(midi);
  const timbre = opts.timbre || (S.style && S.style.timbre) || "piano";
  const wave = A.waves[timbre] || A.waves.piano;
  const level = opts.level == null ? 0.6 : opts.level;
  const attack = opts.attack == null ? 0.006 : opts.attack;
  const release = opts.release == null ? 0.38 : opts.release;
  const sustain = opts.sustain == null ? 0.24 : opts.sustain;
  const detune = opts.detune == null ? (timbre === "soft" ? 4.5 : 2.2) : opts.detune;
  const pan = opts.pan == null ? 0 : opts.pan;

  // The scheduler runs ahead of the audio clock. Enqueue a visual event at the
  // exact audio time instead of spawning particles immediately, so light and
  // sound stay locked together even when the look-ahead buffer grows.
  if (!opts.noVisual) visual.push({ t, kind: "note", midi, vel });

  const amp = ctx.createGain();
  const filter = ctx.createBiquadFilter();
  const out = ctx.createGain();
  const panner = ctx.createStereoPanner();

  out.gain.value = level;
  panner.pan.value = clamp(pan, -1, 1);
  filter.type = "lowpass";
  filter.Q.value = 0.45;

  const cutBase = clamp(f * (timbre === "bright" ? 9 : 6.5) * (0.55 + vel), 620, 14000);
  const mid = t + attack + Math.max(0.05, dur * 0.32);
  const end = t + Math.max(attack + 0.08, dur);
  const stop = end + release;

  filter.frequency.setValueAtTime(cutBase, t);
  filter.frequency.exponentialRampToValueAtTime(Math.max(420, cutBase * 0.28), end);

  amp.gain.setValueAtTime(0.0001, t);
  amp.gain.exponentialRampToValueAtTime(Math.max(0.0002, vel), t + attack);
  amp.gain.exponentialRampToValueAtTime(Math.max(0.0002, vel * sustain), mid);
  amp.gain.exponentialRampToValueAtTime(0.0001, end);

  const oscs = [];
  for (const cents of [-detune, detune]) {
    const osc = ctx.createOscillator();
    osc.setPeriodicWave(wave);
    osc.frequency.value = f;
    osc.detune.value = cents;
    osc.connect(filter);
    osc.start(t);
    osc.stop(stop + 0.04);
    A.sources.add(osc);
    oscs.push(osc);
  }

  filter.connect(amp);
  amp.connect(out);
  out.connect(panner);
  panner.connect(A.dry);
  panner.connect(A.reverbSend);
  panner.connect(A.delaySend);

  const last = oscs[oscs.length - 1];
  last.onended = () => {
    for (const o of oscs) A.sources.delete(o);
    try { panner.disconnect(); out.disconnect(); amp.disconnect(); filter.disconnect(); } catch (e) {}
  };

  if (vel > 0.5 && timbre !== "soft") {
    noiseHit(t, clamp(f * 2.6, 900, 5200), 1.0, 0.03 * vel * level, 0.045, 0.25);
  }
}

/**
 * Fire a short filtered noise burst. Used for the hammer transient and for
 * every acoustic-ish percussion voice; `reverb` is a per-hit send amount so
 * hats can stay dry while brushes sit further back in the room.
 *
 * @param {number} when start time
 * @param {number} freq band-pass centre
 * @param {number} q filter resonance
 * @param {number} gain peak gain
 * @param {number} dur seconds
 * @param {number} [reverb=0.5] send level, 0..1
 */
function noiseHit(when, freq, q, gain, dur, reverb = 0.5) {
  if (!A.ctx || !A.noise) return;
  const ctx = A.ctx;
  const t = Math.max(when, ctx.currentTime + 0.002);
  const src = ctx.createBufferSource();
  src.buffer = A.noise;
  const filter = ctx.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = clamp(freq, 80, 12000);
  filter.Q.value = q;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.02, dur));
  src.connect(filter);
  filter.connect(g);
  g.connect(A.dry);
  let send = null;
  if (reverb > 0) {
    send = ctx.createGain();
    send.gain.value = reverb;
    g.connect(send);
    send.connect(A.reverbSend);
  }
  src.start(t);
  src.stop(t + Math.max(0.03, dur) + 0.03);
  trackSource(src, filter, g, send);
}

/**
 * Soft sine kick with a fast pitch drop. Deliberately short and quiet: it
 * is a pulse for the arpeggios, not a dance-music kick.
 *
 * @param {number} when
 * @param {number} [vel=0.65]
 */
function kick(when, vel = 0.65) {
  if (!A.ctx) return;
  const ctx = A.ctx;
  const t = Math.max(when, ctx.currentTime + 0.002);
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(150, t);
  osc.frequency.exponentialRampToValueAtTime(43, t + 0.12);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5 * vel, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
  osc.connect(g);
  g.connect(A.dry);
  osc.start(t);
  osc.stop(t + 0.38);
  trackSource(osc, g);
}

/**
 * Lo-fi snare: band-passed noise for the brush/body plus a quiet triangle
 * thump for weight. Both layers are short so the reverb tail does the work.
 *
 * @param {number} when
 * @param {number} [vel=0.5]
 */
function snare(when, vel = 0.5) {
  noiseHit(when, 1850, 0.8, 0.12 * vel, 0.15, 0.7);
  if (!A.ctx) return;
  const ctx = A.ctx;
  const t = Math.max(when, ctx.currentTime + 0.002);
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = "triangle";
  osc.frequency.setValueAtTime(190, t);
  osc.frequency.exponentialRampToValueAtTime(120, t + 0.09);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.07 * vel, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
  osc.connect(g);
  g.connect(A.dry);
  osc.start(t);
  osc.stop(t + 0.12);
  trackSource(osc, g);
}

/**
 * Closed hi-hat: very short high-passed noise, kept nearly dry.
 *
 * @param {number} when
 * @param {number} [vel=0.3]
 */
function hat(when, vel = 0.3) {
  noiseHit(when, 7800, 1.2, 0.055 * vel, 0.045, 0.15);
}
/**
 * Bossa shaker: slightly longer, softer noise than the hat, with a little
 * room send so it shimmers behind the comping.
 *
 * @param {number} when
 * @param {number} [vel=0.28]
 */
function shaker(when, vel = 0.28) {
  noiseHit(when, 5200, 1.6, 0.042 * vel, 0.085, 0.2);
}
/**
 * Brushed snare sweep used by the jazz style: low-Q band-passed noise with
 * a longer decay, suggesting a wire brush rather than a stick.
 *
 * @param {number} when
 * @param {number} [vel=0.4]
 */
function brush(when, vel = 0.4) {
  noiseHit(when, 1500, 0.6, 0.075 * vel, 0.22, 0.6);
}

/**
 * Start the looping vinyl bed. Safe to call repeatedly; the existing loop
 * is reused. The gain ramps in slowly so switching to Lo-Fi mid-piece does
 * not produce a click.
 */
function startVinyl() {
  if (!A.ctx || A.vinyl) return;
  const ctx = A.ctx;
  const src = ctx.createBufferSource();
  src.buffer = A.vinylBuf;
  src.loop = true;
  const g = ctx.createGain();
  g.gain.value = 0.0001;
  src.connect(g);
  g.connect(A.dry);
  const send = ctx.createGain();
  send.gain.value = 0.3;
  g.connect(send);
  send.connect(A.reverbSend);
  src.start();
  g.gain.linearRampToValueAtTime(0.045, ctx.currentTime + 1.2);
  A.vinyl = src;
  A.vinylGain = g;
  A.vinylSend = send;
}

/**
 * Fade and dispose of the vinyl loop. The source is stopped slightly after
 * the gain reaches silence so the fade is actually audible.
 */
function stopVinyl() {
  if (!A.vinyl || !A.ctx) return;
  const now = A.ctx.currentTime;
  const src = A.vinyl;
  const g = A.vinylGain;
  const send = A.vinylSend;
  try {
    g.gain.cancelScheduledValues(now);
    g.gain.setValueAtTime(g.gain.value || 0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
    src.stop(now + 0.4);
    src.onended = () => {
      try { g.disconnect(); } catch (e) {}
      try { send.disconnect(); } catch (e) {}
    };
  } catch (e) {}
  A.vinyl = null;
  A.vinylGain = null;
  A.vinylSend = null;
}

/**
 * Immediately stop every tracked source. Called on pause after the master
 * has faded down; stopping sources while they are audible would click.
 */
function stopAllVoices() {
  if (!A.ctx) return;
  const now = A.ctx.currentTime;
  for (const src of A.sources) {
    try { src.stop(now); } catch (e) {}
  }
  A.sources.clear();
}

/**
 * (Re)create the tape-delay line and wire it between the delay send and the
 * delay return.
 *
 * It exists as a function because pause has to *rebuild* the line: a
 * DelayNode's buffer keeps ringing after its input goes quiet, and muting the
 * return is not enough — re-opening it later would replay up to a full delay
 * time of the phrase before the pause. Replacing the node is the only way to
 * empty that buffer, and it is cheap next to the convolver reset.
 */
function buildDelayLine() {
  const ctx = A.ctx;
  const delay = ctx.createDelay(1.5);
  delay.delayTime.value = 0.32;
  const damp = ctx.createBiquadFilter();
  damp.type = "lowpass";
  damp.frequency.value = 2400;
  const feedback = ctx.createGain();
  feedback.gain.value = DELAY_FEEDBACK;
  delay.connect(damp);
  damp.connect(feedback);
  feedback.connect(delay);
  delay.connect(A.delayWet);
  // The send has exactly one destination; disconnecting it first keeps a
  // rebuilt line from leaving the previous one attached (and alive).
  A.delaySend.disconnect();
  A.delaySend.connect(delay);
  A.delay = delay;
  A.damp = damp;
  A.feedback = feedback;
}

/**
 * Silence the effect buses after the sources stop.
 *
 * Stopping sources is not enough to make pause silent: the convolver keeps
 * emitting its impulse-response tail for seconds and the delay line keeps
 * recirculating echoes. If the master is later raised while those tails are
 * still alive, the previous phrase's reverb reappears out of a silent pause.
 * So the wet returns are muted, re-assigning the impulse response resets the
 * convolver's internal state, and the delay line is rebuilt empty.
 */
function flushTails() {
  if (!A.ctx) return;
  const t = A.ctx.currentTime;
  A.reverbWet.gain.setValueAtTime(0, t);
  A.delayWet.gain.setValueAtTime(0, t);
  if (A.conv && A.irBuffer) A.conv.buffer = A.irBuffer;
  for (const n of [A.delay, A.damp, A.feedback]) {
    try { n.disconnect(); } catch (e) {}
  }
  buildDelayLine();
}

/**
 * Undo `flushTails()` before audio becomes audible again: `updateSpace()`
 * brings both wet returns back, and the rebuilt delay line is already wired.
 */
function armTails() {
  if (!A.ctx) return;
  // Instant, not glided: the delay line was just rebuilt at its default 0.32 s
  // (or is still at a previous style's time), so a ramp here bends the pitch
  // of every echo for the first second after unpausing.
  updateSpace(true);
}
