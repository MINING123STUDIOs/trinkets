const STYLE_MAP = Object.fromEntries(STYLES.map((s) => [s.id, s]));

/**
 * Presentation order for the mood row and the arrow-key cycle: slow to fast.
 * `STYLES` groups related entries together for readability, so anything that
 * walks moods for the visitor uses this list instead.
 */
const STYLE_ORDER = STYLES.slice().sort((a, b) => a.bpm - b.bpm);

/**
 * Choose an inversion of a chord that sounds good in context.
 *
 * Every rotation of the sorted tones (moving the lowest note up an octave)
 * is scored against three pressures: stay near the style's comfortable
 * register, keep every note inside a sane piano range, and move as little
 * as possible from the previous voicing. The result is smooth voice
 * leading rather than block chords jumping around the keyboard.
 *
 * @param {number[]} notes chord tones as MIDI numbers
 * @param {number[]|null} prev previous voicing, if any
 * @param {object} st style configuration (uses `center`)
 * @returns {number[]} the chosen voicing, low to high
 */
function chooseVoicing(notes, prev, st) {
  const base = [...new Set(notes)].sort((a, b) => a - b);
  const center = st.center || 64;
  let best = base;
  let bestScore = Infinity;

  for (let inv = 0; inv <= base.length; inv++) {
    const cand = base.map((n, i) => (i < inv ? n + 12 : n)).sort((a, b) => a - b);
    let score = 0;
    for (const n of cand) {
      score += Math.abs(n - center) * 0.34;
      if (n < 50) score += (50 - n) * 2.2;
      if (n > 88) score += (n - 88) * 3.0;
    }
    if (prev && prev.length) {
      for (const n of cand) {
        let nearest = 99;
        for (const p of prev) nearest = Math.min(nearest, Math.abs(p - n));
        score += nearest * 0.62;
      }
    }
    if (score < bestScore) {
      bestScore = score;
      best = cand;
    }
  }
  return best;
}

/**
 * Derive a human-readable chord symbol and Roman numeral from the actual
 * pitches. Nothing is assumed from the scale degree: the intervals present
 * in the voicing decide whether the chord is major, minor, diminished,
 * augmented, suspended, or a power chord, and whether it carries a seventh
 * or an added ninth. That keeps the display truthful even after random
 * extensions and modal borrowing.
 *
 * @param {number} rootPc root pitch class, 0..11
 * @param {number[]} notes voiced MIDI notes
 * @param {number} degree scale degree 0..6
 * @returns {{label: string, roman: string}}
 */
function chordInfo(rootPc, notes, degree) {
  const rel = new Set(notes.map((n) => (((n - rootPc) % 12) + 12) % 12));
  const has = (x) => rel.has(x);
  const minorThird = has(3);
  const majorThird = has(4);
  const flatFifth = has(6);
  const sharpFifth = has(8);
  const seventh = has(11) ? 11 : has(10) ? 10 : null;
  const ninth = has(2);

  let quality = "maj";
  let base = "";
  if (minorThird && flatFifth && seventh === 10) {
    quality = "m7b5"; base = "m7b5";
  } else if (minorThird && flatFifth) {
    quality = "dim"; base = "dim";
  } else if (minorThird && sharpFifth) {
    quality = "aug"; base = "aug";
  } else if (minorThird) {
    quality = "m"; base = "m";
  } else if (majorThird) {
    quality = "maj"; base = "";
  } else if (has(5)) {
    quality = "sus4"; base = "sus4";
  } else if (has(2)) {
    quality = "sus2"; base = "sus2";
  } else {
    quality = "5"; base = "5";
  }

  let ext = "";
  if (quality !== "m7b5" && quality !== "dim") {
    if (seventh === 11) ext = quality === "m" ? "(maj7)" : "maj7";
    else if (seventh === 10) ext = "7";
  }
  if (ninth && (quality === "maj" || quality === "m")) ext += seventh ? "9" : "add9";

  const label = NOTE_NAMES[rootPc] + base + ext;
  const numerals = ["I", "II", "III", "IV", "V", "VI", "VII"];
  let roman = numerals[degree] || "I";
  if (quality === "m" || quality === "dim" || quality === "m7b5") roman = roman.toLowerCase();
  if (quality === "dim") roman += "°";
  if (quality === "aug") roman += "+";
  if (seventh === 10) roman += "7";
  else if (seventh === 11) roman += "maj7";
  if (ninth) roman += "9";

  return { label, roman };
}

/**
 * Build the next chord from a scale degree.
 *
 * The core is a diatonic stack of thirds (degree, degree+2, degree+4);
 * seventh and ninth extensions are added probabilistically according to
 * the style. The raw stack is then passed through `chooseVoicing`, and
 * "wide" styles get an octave below and above for a cinematic spread.
 *
 * The chord's root pitch class is computed separately from the voicing,
 * so inversions never confuse the label.
 *
 * @param {number} degree 0..6 within the current scale
 * @returns {{degree:number,rootPc:number,notes:number[],label:string,roman:string}}
 */
function buildChord(degree) {
  const st = S.style || STYLE_MAP.nocturne;
  const scale = SCALES[st.scale];
  const tones = [0, 2, 4];
  if (chance(st.seventh || 0)) tones.push(6);
  // A diatonic ninth over a diminished triad is a flat ninth; skip it so the
  // displayed chord symbol and the sounding notes stay in agreement.
  const thirdSpan = ((scale[(degree + 2) % 7] - scale[degree]) + 12) % 12;
  const fifthSpan = ((scale[(degree + 4) % 7] - scale[degree]) + 12) % 12;
  const canAddNinth = !(thirdSpan === 3 && fifthSpan === 6);
  if (canAddNinth && chance(st.ninth || 0)) tones.push(8);

  const base = S.root + 12;
  let notes = tones.map((d) => {
    const i = degree + d;
    const oct = Math.floor(i / 7);
    return base + scale[((i % 7) + 7) % 7] + 12 * oct;
  });
  notes = [...new Set(notes)];

  let voiced = chooseVoicing(notes, S.prevVoicing, st);
  if (st.wide) {
    voiced = [voiced[0] - 12, ...voiced, voiced[voiced.length - 1] + 12]
      .filter((n) => n >= 38 && n <= 90);
    voiced = [...new Set(voiced)].sort((a, b) => a - b);
  }
  S.prevVoicing = voiced;

  const rootPc = ((S.root + scale[degree]) % 12 + 12) % 12;
  const info = chordInfo(rootPc, voiced, degree);
  return { degree, rootPc, notes: voiced, label: info.label, roman: info.roman };
}

/**
 * Expand the current chord into a sorted pool for arpeggiation, repeating
 * it across the style's requested number of octaves and clipping to a
 * practical piano range.
 *
 * @returns {number[]} MIDI notes, low to high
 */
function arpPool() {
  const st = S.style || STYLE_MAP.nocturne;
  const a = st.layers.arp || {};
  const notes = S.chord ? S.chord.notes.slice().sort((x, y) => x - y) : [];
  const octaves = a.octaves || 2;
  let pool = [];
  for (let o = 0; o < octaves; o++) {
    for (const n of notes) pool.push(n + 12 * o);
  }
  pool = [...new Set(pool)].filter((n) => n >= 48 && n <= 92).sort((x, y) => x - y);
  return pool.length ? pool : [60, 64, 67];
}

/**
 * Pick the next arpeggio note. The running index makes up/down/up-down
 * patterns deterministic within a chord while still changing from chord
 * to chord; "random" is the exception and is intentionally unordered.
 *
 * @param {number[]} pool output of `arpPool()`
 * @returns {number} MIDI note
 */
function nextArp(pool) {
  const a = (S.style && S.style.layers.arp) || {};
  const len = pool.length;
  const i = S.arpIndex++;
  if (a.pattern === "down") return pool[len - 1 - (i % len)];
  if (a.pattern === "updown") {
    const period = Math.max(1, len * 2 - 2);
    const k = i % period;
    return pool[k < len ? k : period - k];
  }
  if (a.pattern === "random") return pick(pool);
  return pool[i % len];
}

/**
 * Choose the next bass note. Modes are simple on purpose: root, root-fifth
 * alternation, octave alternation, or a four-step walking figure. Keeping
 * the bass at octave 2 leaves the chord voicings room to breathe.
 *
 * @returns {number} MIDI note
 */
function bassNote() {
  const st = S.style || STYLE_MAP.nocturne;
  const b = st.layers.bass || {};
  const root = 36 + (S.chord ? S.chord.rootPc : 0);
  const i = S.bassIndex++;
  if (b.mode === "walk") {
    const walk = [root, root + 7, root + 12, root + 10];
    return clamp(walk[i % walk.length], 33, 55);
  }
  if (b.mode === "rootFifth") return i % 2 ? root + 7 : root;
  if (b.mode === "octave") return i % 2 ? root + 12 : root;
  return root;
}

/**
 * Generate a single melody note by a short random walk through the scale.
 *
 * Preferences, in order: stay within a fifth of the previous note, land on
 * a chord tone, and occasionally leap. The walk is clamped to a high
 * register so it never collides with the chord bed.
 *
 * @returns {number} MIDI note
 */
function melodyNote() {
  const st = S.style || STYLE_MAP.nocturne;
  const scale = SCALES[st.scale];
  const base = S.root + 24;
  const chordPcs = new Set((S.chord ? S.chord.notes : []).map(pcOf));
  const candidates = [];

  for (let oct = 0; oct < 2; oct++) {
    for (let d = 0; d < 7; d++) {
      const n = base + oct * 12 + scale[d];
      if (n >= 58 && n <= 90) candidates.push(n);
    }
  }
  if (!candidates.length) return base + 12;

  let note;
  if (S.melodyPrev == null) {
    const tones = candidates.filter((n) => chordPcs.has(pcOf(n)));
    note = tones.length ? pick(tones) : pick(candidates);
  } else if (chance(0.22)) {
    note = pick(candidates); // occasional leap
  } else {
    const near = candidates.filter((n) => Math.abs(n - S.melodyPrev) <= 7 && n !== S.melodyPrev);
    note = near.length ? pick(near) : pick(candidates);
    if (chance(0.45)) {
      const snapped = near.filter((n) => chordPcs.has(pcOf(n)) && Math.abs(n - S.melodyPrev) <= 5);
      if (snapped.length) note = pick(snapped);
    }
  }
  S.melodyPrev = note;
  return note;
}

/* ------------------------------------------------------------------ *
 * Scheduler: look-ahead clock, one 16th note at a time
 * ------------------------------------------------------------------ */

/**
 * Move the progression forward and schedule the pad for the new harmony.
 *
 * Most of the time the next degree comes from the style's progression, but
 * `wander` occasionally substitutes any diatonic degree. Immediate repeats
 * are discouraged so the harmony keeps moving. The pad is scheduled here
 * (not in the step loop) because it sustains for the whole chord window.
 *
 * @param {number} time AudioContext time of the chord change
 */
function advanceChord(time) {
  const st = S.style;
  const seq = st.progression;
  const idx = S.chordIndex % seq.length;
  let degree = seq[idx];

  if (S.chordIndex > 0 && chance(st.wander || 0)) {
    degree = pick([0, 1, 2, 3, 4, 5, 6]);
  }
  // avoid a static loop of the same chord
  if (S.chord && degree === S.chord.degree && chance(0.65)) {
    degree = seq[(idx + 1) % seq.length];
  }

  S.chordIndex++;
  S.chord = buildChord(degree);
  S.forceChord = false;

  const p = st.layers.pad;
  if (p && p.on) {
    const durBeats = (st.chordSteps / 4) * (p.stretch || 1);
    for (const n of S.chord.notes) {
      playVoice(n, time + 0.012, durBeats, p.vel * rand(0.85, 1.12), {
        timbre: "soft",
        level: p.level,
        attack: p.attack,
        release: p.release,
        sustain: 0.72,
        detune: 5.5,
        pan: rand(-0.28, 0.28)
      });
    }
  }

  visual.push({ t: time, kind: "chord", chord: S.chord });
}

/**
 * Schedule everything that happens on one 16th-note grid position.
 *
 * Layers are independent so a style is just data: comping hits, arpeggio
 * rate/pattern, bass hits, melodic density, pad, and percussion patterns.
 * The Density slider multiplies the probabilistic layers but never the
 * bass or the explicit drum hits, which anchor the groove.
 *
 * Swing is applied per position: the second eighth of each beat is pushed
 * later, while odd 16ths get a smaller nudge. This keeps shuffled styles
 * from sounding mechanically quantised.
 *
 * `barSteps` is the mood's bar length in 16ths (16 unless a mood opts into a
 * shorter metre, as the waltz does). It only bounds the pattern grids; the
 * look-ahead clock keeps counting absolute 16ths, so swing, arp and melody
 * rates are untouched by it.
 *
 * @param {number} step absolute 16th-note counter (used for bar math)
 * @param {number} time AudioContext start time for this grid position
 */
function scheduleStep(step, time) {
  const st = S.style;
  if (!st) return;

  const pos = step % (st.barSteps || 16);
  if (S.forceChord || !S.chord || step % st.chordSteps === 0) {
    advanceChord(time);
  }

  const spb = 60 / Math.max(30, S.bpm);
  const sd = spb / 4;
  const sw = st.swing || 0;
  let swingOffset = 0;
  if (pos % 4 === 2) swingOffset = sw * sd * 0.67;
  else if (pos % 2 === 1) swingOffset = sw * sd * 0.25;
  const t = time + swingOffset;

  const d = 0.55 + S.density * 0.95;
  const L = st.layers;

  const c = L.chord;
  if (c && c.hits && c.hits.includes(pos) && chance((c.prob == null ? 1 : c.prob) * Math.min(1, d))) {
    for (const n of S.chord.notes) {
      playVoice(n, t, c.dur, c.vel * rand(0.88, 1.08), {
        level: c.level,
        pan: rand(-0.3, 0.3)
      });
    }
  }

  const a = L.arp;
  if (a && pos % (a.every || 2) === 0 && chance(clamp((a.prob == null ? 0.8 : a.prob) * d, 0, 1))) {
    const n = nextArp(arpPool());
    if (n != null) {
      playVoice(n, t, a.dur, a.vel * rand(0.8, 1.12), {
        level: a.level,
        timbre: st.timbre,
        pan: rand(-0.4, 0.4),
        detune: 2
      });
    }
  }

  const b = L.bass;
  if (b && b.hits.includes(pos)) {
    playVoice(bassNote(), t, b.dur, b.vel * rand(0.9, 1.05), {
      level: b.level,
      timbre: "soft",
      detune: 1.5,
      sustain: 0.5
    });
  }

  const m = L.melody;
  if (m && pos % (m.every || 4) === 0 && chance(clamp((m.prob == null ? 0.3 : m.prob) * d, 0, 1))) {
    playVoice(melodyNote(), t, m.dur, m.vel * rand(0.82, 1.1), {
      level: m.level,
      pan: rand(-0.3, 0.3)
    });
  }

  const p = L.perc;
  if (p) {
    if (p.kick && p.kick.includes(pos)) kick(t, rand(0.55, 0.75));
    if (p.snare && p.snare.includes(pos)) snare(t, rand(0.35, 0.55));
    if (p.brush && p.brush.includes(pos)) brush(t, rand(0.3, 0.5));
    if (p.shaker && pos % p.shaker.every === 0 && chance(clamp(p.shaker.prob * d, 0, 1))) {
      shaker(t, p.shaker.vel * rand(0.7, 1.1));
    }
    if (p.hat && pos % p.hat.every === 0 && chance(clamp(p.hat.prob * d, 0, 1))) {
      hat(t, p.hat.vel * rand(0.6, 1.2));
    }
  }
}

/**
 * Look-ahead scheduler. A timer wakes up often enough to keep 450 ms of
 * music queued (2 s in a visible-but-unfocused window, 12 s when the tab is
 * hidden and timers are throttled); notes are scheduled against the audio
 * clock, never played from the timer itself. That keeps timing stable under
 * UI jank, a dimmed phone screen, or a browser that slows timers for a page it
 * considers inactive.
 *
 * If the tab was backgrounded, `nextTime` can be far in the past. Rather
 * than firing a burst of catch-up notes, the clock resynchronises just
 * ahead of the current audio time.
 */
function tick() {
  perfTick();
  if (!S.playing || !A.ctx) return;
  // During a style cross-fade the master is dipped; scheduling through the dip
  // would burn notes nobody hears, so the clock waits for the hand-over.
  if (S.transitioning) return;
  const now = A.ctx.currentTime;
  if (S.nextTime < now - 0.25) S.nextTime = now + 0.03; // tab was asleep
  // A hidden tab can have its timers throttled to roughly one tick every
  // 5-10 seconds, so it needs a 12 s buffer to avoid gaps. A visible but
  // merely unfocused window is not throttled that hard, and 12 s there means
  // hundreds of live oscillators (DevTools focus counts as unfocused, so
  // profiling made this worse). 2 s is still a wide safety margin for the
  // visible case; the active tab keeps the tight 450 ms horizon.
  //
  // `document.hasFocus()` is checked directly because some mobile browsers do
  // not deliver a window blur event on an app switch, leaving `tabFocused`
  // stale while timers are already being throttled.
  const unfocused = typeof document.hasFocus === "function"
    ? !document.hasFocus()
    : !tabFocused;
  const horizon = document.hidden ? 12.0 : unfocused ? 2.0 : 0.45;
  PERF.horizon = horizon;
  const stepDur = 60 / Math.max(30, S.bpm) / 4;
  // The guard must cover the whole horizon, not a fixed 64 steps, or a fast
  // style would truncate the buffer before it is full.
  const maxSteps = Math.min(1000, Math.ceil(horizon / stepDur) + 4);
  let guard = 0;
  while (S.nextTime < now + horizon && guard++ < maxSteps) {
    // A late timer can leave several grid steps in the past. Skipping them
    // is better than letting playVoice clamp them all to "now", which turns
    // a stall into an audible flam. The 20 ms tolerance keeps genuine jitter.
    if (S.nextTime >= now - 0.02) scheduleStep(S.step, S.nextTime);
    S.nextTime += stepDur;
    S.step++;
  }
}
/* ------------------------------------------------------------------ *
 * Canvas: slow aurora, note particles, chord ripples, waveform
 * ------------------------------------------------------------------ */

const canvas = els.canvas;
const g2d = canvas.getContext("2d");
let W = 0;
let H = 0;
let DPR = 1;
let stars = [];
let particles = [];
let rings = [];
let lastFrame = 0;
let rafId = 0;
let visualTimer = null;
let deckTop = 0;
let bgCanvas = null;
let bgCtx = null;
let bgW = 1;
let bgH = 1;
let lastBg = -1;

/**
 * Pre-render a soft radial glow once per palette. Drawing a cached sprite
 * is dramatically cheaper than building a gradient for every particle on
 * every frame, which matters on phones.
 *
 * @param {string} rgb "r,g,b"
 * @returns {HTMLCanvasElement}
 */
function makeSprite(rgb) {
  const c = document.createElement("canvas");
  c.width = c.height = 64;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  // Additive glow wants a white-hot core; multiply blending does not, because
  // white is the identity and would punch a hole in the colour. The light
  // sprite is therefore all accent, with no white centre.
  grad.addColorStop(0, light ? `rgba(${rgb},.95)` : "rgba(255,255,255,.95)");
  grad.addColorStop(0.28, `rgba(${rgb},${light ? 0.78 : 0.82})`);
  grad.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
  return c;
}

/**
 * Build the two glow sprites used by note particles. Rebuilt only when the
 * style palette changes.
 * @returns {{a: HTMLCanvasElement, b: HTMLCanvasElement}}
 */
function makeSprites() {
  return { a: makeSprite(S.palette.a), b: makeSprite(S.palette.b) };
}

/**
 * Size the canvas to the viewport at device pixel ratio (capped at 2 so
 * high-DPI phones do not melt), reset the transform, and reseed the star
 * field. Called on load and after a debounced resize.
 */
function resizeCanvas() {
  // Default caps: 2x on desktop, 1.5x on phones. `?dpr=N` overrides the cap for
  // a fill-rate comparison without touching anything else.
  const cap = isFinite(DIAG.dpr) && DIAG.dpr > 0
    ? DIAG.dpr
    : (window.innerWidth < 760 ? 1.5 : 2);
  DPR = Math.min(cap, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.max(1, Math.floor(W * DPR));
  canvas.height = Math.max(1, Math.floor(H * DPR));
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  g2d.setTransform(DPR, 0, 0, DPR, 0, 0);
  // Cache the deck's top edge: reading layout for every note particle would
  // cause avoidable main-thread work while audio is playing.
  deckTop = els.deck ? els.deck.getBoundingClientRect().top : H * 0.7;
  // The aurora changes very slowly, so render it into a quarter-resolution
  // buffer at ~10 fps and upscale it. Filling the full-screen gradients three
  // times per frame was the largest avoidable cost on phones.
  bgW = Math.max(1, Math.floor(W / 4));
  bgH = Math.max(1, Math.floor(H / 4));
  bgCanvas = document.createElement("canvas");
  bgCanvas.width = bgW;
  bgCanvas.height = bgH;
  bgCtx = bgCanvas.getContext("2d");
  lastBg = -1;
  stars = Array.from({ length: window.innerWidth < 760 ? 55 : 90 }, () => ({
    x: Math.random(),
    y: Math.random(),
    r: rand(0.35, 1.4),
    ph: rand(0, Math.PI * 2),
    sp: rand(0.25, 0.9)
  }));
  S.sprites = makeSprites();
}

/**
 * Horizontal position for a note the keybed does not show.
 *
 * Bass below and melody above the displayed octaves used to be placed by a
 * pitch-proportional formula tuned to the canvas width, which drifted right of
 * the actual keys. Snapping to the nearest displayed key keeps every mote
 * over the keybed, which is what the eye expects.
 *
 * @param {number} midi
 * @returns {number} viewport x in pixels
 */
function nearestKeyX(midi) {
  if (!keyBed) return W / 2;
  if (midi <= keyBed.lo) return keyBed.left;
  if (midi >= keyBed.hi) return keyBed.right;
  // Inside the range every note has a key; this is only a safety net.
  const norm = clamp((midi - 36) / 54, 0, 1);
  return clamp(W * (0.13 + norm * 0.74), keyBed.left, keyBed.right);
}

/**
 * Emit a rising light mote for a note. Pitch maps to horizontal position,
 * so bass notes appear on the left and high notes on the right; velocity
 * controls size. The particle list is capped to keep the frame budget flat.
 *
 * @param {number} midi
 * @param {number} vel 0..1
 */
function spawnParticle(midi, vel) {
  if (!S.visuals) return;
  if (!S.sprites) S.sprites = makeSprites();
  // Spawn just above the control deck so the motes are not hidden behind it.
  const spawnY = Math.max(H * 0.34, Math.min(H * 0.72, (deckTop || H * 0.7) - 16));
  // Prefer the real key centre so the mote rises from the key that sounded.
  // Notes outside the displayed octaves snap to the nearest displayed key
  // rather than a pitch-proportional guess, which used to land them to the
  // right of the keybed.
  const keyX = keyCenters.get(midi);
  let x = keyX != null ? keyX : nearestKeyX(midi);
  x += rand(-6, 6);
  if (keyBed) x = clamp(x, keyBed.left, keyBed.right);
  particles.push({
    x,
    y: spawnY,
    vx: rand(-14, 14),
    vy: rand(-72, -30),
    life: rand(1.7, 3.4),
    age: 0,
    size: rand(14, 26) + vel * 20,
    sprite: chance(0.5) ? S.sprites.a : S.sprites.b
  });
  if (particles.length > (W < 760 ? 110 : 190)) particles.shift();
}

/**
 * Emit an expanding ring on each chord change, a quiet visual cadence that
 * matches the harmonic rhythm.
 */
function spawnRing() {
  if (!S.visuals) return;
  rings.push({ r: 0, age: 0, life: 1.7 });
  if (rings.length > 6) rings.shift();
}

/**
 * Drain visual events whose audio start time has arrived.
 *
 * Audio is scheduled ahead of time, so firing visuals at schedule time
 * would make the lights run early. Each event carries its exact
 * AudioContext timestamp and waits here until that moment.
 */
function processVisual() {
  if (!A.ctx) return;
  const now = A.ctx.currentTime;
  while (visual.length && visual[0].t <= now) {
    const ev = visual.shift();
    // After a long background pause, drop stale note flashes instead of
    // firing a whole burst of particles at once.
    if (ev.kind === "note" && ev.t < now - 0.6) continue;
    if (ev.kind === "chord") {
      updateChordUI(ev.chord);
      // Returning from a throttled background drains a queue full of stale
      // chords; only the fresh one gets a ripple.
      if (ev.t >= now - 0.6) spawnRing();
    } else if (ev.kind === "note") {
      spawnParticle(ev.midi, ev.vel);
      flashKey(ev.midi);
    }
  }
  if (visual.length > 240) visual.splice(0, visual.length - 240);
}

/**
 * Draw the master bus waveform as a faint ribbon behind the chord name.
 * The analyser is time-domain only; no FFT work is needed for this effect.
 *
 * The ribbon is part of the stage in every state: silence is a flat line
 * rather than a missing one. It reads the analyser whenever the audio graph
 * exists and the volume is above zero — including while paused, so a note
 * played by hand still moves it. Before the first gesture there is no
 * analyser, and at volume zero nothing is audible; both cases draw the
 * baseline.
 */
function drawWave() {
  const y0 = H * 0.56;
  const amp = Math.min(72, H * 0.075);
  const live = S.volume > 0 && A.analyser && A.waveData;

  g2d.beginPath();
  if (live) {
    A.analyser.getFloatTimeDomainData(A.waveData);
    const data = A.waveData;
    const step = Math.max(1, Math.floor(data.length / 180));
    for (let i = 0; i < data.length; i += step) {
      const x = (i / (data.length - 1)) * W;
      const y = y0 + data[i] * amp;
      if (i === 0) g2d.moveTo(x, y);
      else g2d.lineTo(x, y);
    }
  } else {
    g2d.moveTo(0, y0);
    g2d.lineTo(W, y0);
  }
  g2d.strokeStyle = `rgba(${S.palette.a},${light ? 0.20 : 0.11})`;
  g2d.lineWidth = 1.2;
  g2d.stroke();
}

/**
 * Paint the slow aurora into the small offscreen buffer. Called at ~10 fps
 * because the fields drift too slowly for anything faster to be visible.
 *
 * @param {number} t seconds since page start
 */
function renderBackground(t) {
  bgCtx.clearRect(0, 0, bgW, bgH);
  // Same reasoning as the main loop: multiply for the pale stage, and the
  // alphas are raised because 10% multiply is far fainter than 10% additive.
  bgCtx.globalCompositeOperation = light ? "multiply" : "lighter";
  for (let i = 0; i < 3; i++) {
    const speed = 0.05 + i * 0.017;
    const ph = i * 2.1;
    const cx = bgW * (0.5 + 0.4 * Math.sin(t * speed + ph));
    const cy = bgH * (0.42 + 0.26 * Math.cos(t * speed * 0.83 + ph));
    const R = Math.max(bgW, bgH) * (0.3 + 0.08 * Math.sin(t * 0.11 + i));
    const rgb = i === 1 ? S.palette.b : S.palette.a;
    const grad = bgCtx.createRadialGradient(cx, cy, 0, cx, cy, R);
    grad.addColorStop(0, `rgba(${rgb},${light ? 0.17 : 0.10})`);
    grad.addColorStop(0.55, `rgba(${rgb},${light ? 0.075 : 0.035})`);
    grad.addColorStop(1, `rgba(${rgb},0)`);
    bgCtx.fillStyle = grad;
    bgCtx.fillRect(0, 0, bgW, bgH);
  }
}

/**
 * Main animation loop: aurora fields, stars, waveform, chord ripples, and
 * note particles. Everything is additive ("lighter") so overlapping glows
 * bloom instead of muddying. `dt` is clamped to avoid huge jumps after a
 * background tab returns.
 *
 * The loop is only scheduled while `S.visuals` is true. In minimal mode the
 * audio and chord display keep running via `processVisual`, but no canvas
 * pixels are touched and the browser can stop compositing the scene.
 *
 * @param {number} ts high-resolution timestamp from requestAnimationFrame
 */
function draw(ts) {
  rafId = 0;
  const t = ts / 1000;
  const elapsed = Math.max(0, (ts - lastFrame) / 1000) || 0.016;
  // Movement uses a clamped step so a stalled frame cannot teleport anything.
  const dt = Math.min(0.05, elapsed);
  // Lifetimes use the real elapsed time instead. An unfocused window can have
  // rAF throttled to ~1 fps, and ageing by `dt` there made a 3 s mote live 60
  // real seconds while fresh ones kept arriving: the pool saturated with frozen
  // particles that never seemed to die. Real time also expires everything that
  // came due while the tab was away in a single frame, which is what you want
  // on return: no ghosts replaying the last minutes of notes.
  const ageDt = elapsed;
  lastFrame = ts;

  processVisual();
  if (!S.visuals) return;
  g2d.clearRect(0, 0, W, H);

  // ?noaurora and ?nofx are diagnostics: each skips one layer so a slow frame
  // can be attributed to it. Both are inert when the flag is absent.
  if (!DIAG.noaurora) {
    // Refresh the cached aurora at ~10 fps; it moves too slowly to need more.
    if (bgCtx && (lastBg < 0 || t - lastBg > 0.1)) {
      renderBackground(t);
      lastBg = t;
    }
    if (bgCanvas) g2d.drawImage(bgCanvas, 0, 0, W, H);
  }
  // Additive on black blooms; on white it can only go lighter, which is
  // invisible. Multiply darkens instead, so the same overlay reads as colour.
  g2d.globalCompositeOperation = light ? "multiply" : "lighter";

  if (!DIAG.nofx) {
    for (const s of stars) {
      const tw = 0.5 + 0.5 * Math.sin(t * s.sp + s.ph);
      g2d.globalAlpha = (light ? 0.10 : 0.05) + tw * (light ? 0.26 : 0.2);
      g2d.fillStyle = `rgba(${S.palette.a},1)`;
      g2d.beginPath();
      g2d.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      g2d.fill();
    }
    g2d.globalAlpha = 1;

    drawWave();

    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.age += ageDt;
      r.r += Math.max(W, H) * 0.33 * dt;
      const k = r.age / r.life;
      if (k >= 1) {
        rings.splice(i, 1);
        continue;
      }
      g2d.beginPath();
      g2d.arc(W * 0.5, H * 0.46, r.r, 0, Math.PI * 2);
      g2d.strokeStyle = `rgba(${S.palette.a},${(1 - k) * (light ? 0.46 : 0.34)})`;
      g2d.lineWidth = 1.1;
      g2d.stroke();
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.age += ageDt;
      if (p.age >= p.life) {
        particles.splice(i, 1);
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 6 * dt;
      p.vx *= 0.995;
      const k = p.age / p.life;
      g2d.globalAlpha = Math.sin(Math.PI * k) * (light ? 0.62 : 0.8);
      g2d.drawImage(p.sprite, p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
  }
  g2d.globalAlpha = 1;
  g2d.globalCompositeOperation = "source-over";

  rafId = requestAnimationFrame(draw);
}

/* ------------------------------------------------------------------ *
 * Keyboard: DOM keys, highlighted for harmony and note hits
 * ------------------------------------------------------------------ */

/**
 * Glissando state: the pointer currently travelling across the keybed and the
 * last note it sounded.
 *
 * A drag is tracked on `window` rather than on the keys, because the pointer
 * leaves the original key almost immediately. `midi` doubles as the retrigger
 * guard: `pointermove` fires many times per key, and only a change of key
 * should produce a new note. Resetting it on pointerup means a fresh drag
 * always sounds its first key again.
 */
const glide = { id: null, midi: null };

/**
 * Resolve the piano key under a viewport point.
 * @param {number} x client X
 * @param {number} y client Y
 * @returns {number|null} MIDI note, or null when the point is off the keybed
 */
function keyAt(x, y) {
  const el = document.elementFromPoint(x, y);
  const key = el && el.closest ? el.closest(".key") : null;
  if (!key) return null;
  const midi = Number(key.dataset.midi);
  return Number.isFinite(midi) ? midi : null;
}

/**
 * Bind one piano key to its single press path.
 *
 * Pointer presses fire on `pointerdown` so the note sounds the instant the
 * key is touched. A button activated from the keyboard or assistive tech
 * fires `click` instead, with no pointer event at all — that path used to do
 * nothing. Routing it through the same `tapKey()` call makes mouse, touch,
 * Tab+Enter and screen-reader activation literally one code path. A
 * keyboard-generated click reports `detail === 0`, which is what separates it
 * from the compatibility click that follows a pointer press.
 *
 * Starting a press also arms `glide`, so holding the button and sliding plays
 * every key the pointer passes over (the window listeners are registered once,
 * below `buildKeyboard()`).
 *
 * @param {HTMLElement} el key element
 * @param {number} midi note the key plays
 */
function bindKey(el, midi) {
  el.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    glide.id = e.pointerId;
    glide.midi = midi;
    tapKey(midi);
  });
  el.addEventListener("click", (e) => {
    if (e.detail === 0) tapKey(midi);
  });
}

/**
 * Render a responsive piano keyboard with absolutely positioned keys.
 *
 * White keys divide the width evenly; black keys straddle the boundary
 * after their preceding white key. Desktop shows four octaves (C2–C6),
 * narrow screens show two (C3–C5) so the keys stay tappable. The map from
 * MIDI number to element is kept in `keyEls` for highlight updates.
 */
function buildKeyboard() {
  const wrap = els.keys;
  wrap.innerHTML = "";
  keyEls.clear();

  const wide = window.innerWidth >= 760;
  const start = wide ? 36 : 48;
  const end = wide ? 84 : 72;

  const whites = [];
  for (let m = start; m <= end; m++) {
    if (!isBlackPc(m % 12)) whites.push(m);
  }
  const count = whites.length;
  const w = 100 / count;

  whites.forEach((m, i) => {
    const el = document.createElement("button");
    el.type = "button";
    el.className = "key white";
    el.style.left = i * w + "%";
    el.style.width = w + "%";
    el.dataset.midi = String(m);
    el.setAttribute("aria-label", noteName(m));
    if (m % 12 === 0) {
      const label = document.createElement("span");
      label.className = "klabel";
      label.textContent = noteName(m);
      el.appendChild(label);
    }
    bindKey(el, m);
    wrap.appendChild(el);
    keyEls.set(m, el);
  });

  let seen = 0;
  for (let m = start; m <= end; m++) {
    if (!isBlackPc(m % 12)) {
      seen++;
      continue;
    }
    const el = document.createElement("button");
    el.type = "button";
    el.className = "key black";
    el.style.left = seen * w - w * 0.31 + "%";
    el.style.width = w * 0.62 + "%";
    el.dataset.midi = String(m);
    el.setAttribute("aria-label", noteName(m));
    bindKey(el, m);
    wrap.appendChild(el);
    keyEls.set(m, el);
  }

  // Cache centres after layout so `spawnParticle` can put a mote above the key
  // that produced it. Out-of-range notes (bass below C2, melody above C6) have
  // no key and snap to the nearest one (see `nearestKeyX`).
  keyCenters.clear();
  for (const [m, el] of keyEls) {
    const r = el.getBoundingClientRect();
    keyCenters.set(m, r.left + r.width / 2);
  }
  // The first and last inserted keys are white, so their centres are the
  // outermost points a mote may use.
  const loX = keyCenters.get(start);
  const hiX = keyCenters.get(end);
  keyBed = loX != null && hiX != null
    ? { lo: start, hi: end, left: loX, right: hiX }
    : null;
}

/*
 * Glissando listeners. Registered once at module scope, not in `bindKey()` or
 * `buildKeyboard()`: the keybed is rebuilt on resize and on narrow screens, so
 * per-key handlers would either miss new keys or stack up duplicates.
 *
 * `elementFromPoint` is what makes a drag work across keys whose DOM elements
 * change under the pointer; with touch the browser's implicit pointer capture
 * keeps the events coming to the original key, and they still bubble to
 * `window`, so this path is identical for mouse, pen and finger.
 */
window.addEventListener("pointermove", (e) => {
  if (glide.id !== e.pointerId) return;
  // A pointer that drifted back in after leaving the window with the button
  // released would otherwise keep "dragging" forever.
  if (e.pointerType === "mouse" && e.buttons === 0) {
    glide.id = null;
    glide.midi = null;
    return;
  }
  const midi = keyAt(e.clientX, e.clientY);
  if (midi == null || midi === glide.midi) return;
  glide.midi = midi;
  tapKey(midi);
});
function endGlide(e) {
  if (glide.id !== e.pointerId) return;
  glide.id = null;
  glide.midi = null;
}
window.addEventListener("pointerup", endGlide);
window.addEventListener("pointercancel", endGlide);

/**
 * Briefly light a key that just sounded. A per-element timeout prevents
 * fast repeated notes from leaving stale highlights behind.
 *
 * @param {number} midi
 */
function flashKey(midi) {
  const el = keyEls.get(midi);
  if (!el) return;
  el.classList.add("on");
  clearTimeout(el._flash);
  el._flash = setTimeout(() => el.classList.remove("on"), 150);
}

/**
 * Persistently tint the keys belonging to the current chord, giving the
 * keyboard a visual memory of the harmony independent of note flashes.
 *
 * @param {number[]} notes
 */
function setChordHighlight(notes) {
  const set = new Set(notes || []);
  for (const [midi, el] of keyEls) {
    el.classList.toggle("chord", set.has(midi));
  }
}

/**
 * Nudge the audio engine after the page becomes visible or focused again.
 * Hidden mobile tabs throttle timers and may suspend the AudioContext; on
 * return we resume it and let `tick()` resynchronise the musical clock.
 */
function wakeAudio() {
  if (!S.playing || !A.ctx) return;
  if (A.ctx.state !== "running") A.ctx.resume().catch(() => {});
  if (S.nextTime < A.ctx.currentTime - 0.25) S.nextTime = A.ctx.currentTime + 0.03;
  tick();
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    wakeAudio();
  } else {
    // Fill the larger background horizon immediately, before this page's
    // timers are slowed down.
    tick();
  }
});
window.addEventListener("focus", () => {
  tabFocused = true;
  wakeAudio();
});
window.addEventListener("blur", () => {
  tabFocused = false;
  // Fill the new 2 s horizon before the throttled timer gets its next turn.
  tick();
});
window.addEventListener("pageshow", wakeAudio);

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    resizeCanvas();
    buildKeyboard();
    if (S.chord) setChordHighlight(S.chord.notes);
  }, 120);
});

/* ------------------------------------------------------------------ *
 * UI: state <-> DOM, transport, keyboard shortcuts, first run
 * ------------------------------------------------------------------ */

let stopToken = 0;
// Guards the style cross-fade timeout so rapid clicking cannot leave a stale
// callback raising the master after a newer switch has taken over.
let styleFadeToken = 0;

/**
 * Push a chord into the display: name, Roman numeral, unique pitch names,
 * and the keyboard tint. Kept separate from scheduling so a paused preview
 * can reuse exactly the same presentation path.
 *
 * @param {{label:string,roman:string,notes:number[]}} chord
 */
function updateChordUI(chord) {
  if (!chord) return;
  els.chordName.textContent = chord.label;
  els.chordRoman.textContent = chord.roman;
  const pcs = [...new Set(chord.notes.map(pcName))];
  els.chordNotes.textContent = pcs.join(" · ");
  setChordHighlight(chord.notes);
  // Restart the entrance animation without keeping a timer around. Minimal
  // mode disables the animation, so it can also skip the forced reflow.
  els.chordName.classList.remove("swap");
  if (S.visuals) {
    void els.chordName.offsetWidth;
    els.chordName.classList.add("swap");
  }
}

/**
 * Recolour the whole instrument from a style's two accent colours.
 * CSS custom properties handle the interface; the same values are cached
 * as RGB triplets for canvas gradients and regenerated glow sprites.
 *
 * In the light theme the accents are re-derived (`accentFor`) rather than used
 * verbatim, so every mood stays legible on a pale stage from one call site.
 *
 * @param {object} st style definition
 */
function applyPalette(st) {
  const a = accentFor(st.accent);
  const b = accentFor(st.accent2);
  const root = document.documentElement.style;
  root.setProperty("--accent", a);
  root.setProperty("--accent2", b);
  root.setProperty("--accent-rgb", hexToRgb(a));
  root.setProperty("--accent2-rgb", hexToRgb(b));
  S.palette = { a: hexToRgb(a), b: hexToRgb(b) };
  S.sprites = makeSprites();
  // The cached aurora is baked with the old palette; repaint it next frame.
  lastBg = -1;
  refreshStyleDots();
}

/**
 * Re-tint the per-style dot swatches. They are set inline from `STYLES` when
 * the buttons are built, so a theme flip has to rewrite them or the row keeps
 * showing the dark-stage pastels.
 */
function refreshStyleDots() {
  if (!els.styleRow) return;
  for (const btn of els.styleRow.children) {
    const st = STYLE_MAP[btn.dataset.style];
    if (st) btn.style.setProperty("--c", accentFor(st.accent));
  }
}

/**
 * Reflect playback state on the play button and live badge.
 */
function updateTransport() {
  els.play.setAttribute("aria-pressed", String(S.playing));
  els.play.setAttribute("aria-label", S.playing ? "Pause" : "Play");
  els.live.classList.toggle("on", S.playing);
  els.live.lastElementChild.textContent = S.playing ? "live" : "paused";
}

/**
 * Start the canvas animation loop if it is not already running.
 */
function startDrawLoop() {
  if (!S.visuals || rafId) return;
  lastFrame = 0;
  rafId = requestAnimationFrame(draw);
}

/**
 * Cancel the canvas animation loop. Safe to call when it is already stopped.
 */
function stopDrawLoop() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = 0;
}

/**
 * In minimal mode a slow interval drains audio-timestamped visual events so
 * the chord name and keyboard feedback stay current without painting. 120 ms
 * is responsive enough for harmony changes and far cheaper than a frame loop.
 */
function startVisualClock() {
  if (visualTimer) return;
  visualTimer = setInterval(processVisual, 120);
}

/**
 * Stop the minimal-mode event clock.
 */
function stopVisualClock() {
  if (visualTimer) clearInterval(visualTimer);
  visualTimer = null;
}

/**
 * Enable or disable the canvas effects.
 *
 * Off stops requestAnimationFrame entirely, hides the canvas, and clears any
 * live particles. The chord display and key highlights keep updating through
 * `processVisual`, so the instrument remains usable with zero per-frame canvas
 * work. The choice is persisted for the next visit.
 *
 * @param {boolean} on
 * @param {boolean} [persist=true] write the preference to localStorage
 */
function setVisuals(on, persist = true) {
  S.visuals = !!on;
  if (document.body) document.body.classList.toggle("no-visuals", !S.visuals);
  if (els.visualsBtn) {
    els.visualsBtn.setAttribute("aria-pressed", String(S.visuals));
    els.visualsBtn.title = S.visuals ? "Hide visuals (V)" : "Show visuals (V)";
  }

  particles.length = 0;
  rings.length = 0;

  if (S.visuals) {
    stopVisualClock();
    lastBg = -1;
    startDrawLoop();
  } else {
    stopDrawLoop();
    if (g2d) g2d.clearRect(0, 0, W, H);
    startVisualClock();
  }

  if (persist) {
    try {
      localStorage.setItem(VISUALS_KEY, S.visuals ? "on" : "off");
    } catch (e) {
      /* Private mode or a file:// origin may refuse storage. */
    }
  }
}

/**
 * Switch between the dark stage and the pale one.
 *
 * Three things have to move together, and they are all here so they cannot
 * drift apart: the `data-theme` attribute (which flips every CSS variable),
 * the re-derived accent pair (the moods' pastels are tuned for black), and the
 * cached aurora buffer (`lastBg = -1`), which is baked with the old palette and
 * would otherwise linger for up to 100 ms.
 *
 * @param {boolean} on
 * @param {boolean} [persist=true] write the shared `tools-theme` preference
 */
function setLight(on, persist = true) {
  light = !!on;
  document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
  if (els.themeBtn) {
    els.themeBtn.textContent = light ? "\uD83C\uDF19" : "\u2600\uFE0F";
    els.themeBtn.setAttribute("aria-label", light ? "Switch to dark mode" : "Switch to light mode");
    els.themeBtn.title = light ? "Switch to dark mode" : "Switch to light mode";
  }
  if (S.style) applyPalette(S.style);
  lastBg = -1;
  if (persist) {
    try {
      localStorage.setItem(THEME_KEY, light ? "light" : "dark");
    } catch (e) {
      /* Private mode or a file:// origin may refuse storage. */
    }
  }
}

/**
 * When paused, step the progression by hand so Skip still shows the next
 * chord. Playback will start from the following chord because the forced
 * change flag is left set.
 */
function previewNext() {
  if (!S.style) return;
  const st = S.style;
  const degree = st.progression[S.chordIndex % st.progression.length];
  S.chordIndex++;
  S.chord = buildChord(degree);
  S.forceChord = true;
  updateChordUI(S.chord);
}

/**
 * Generate and display a chord without scheduling audio. Used on first
 * load, after a key change while paused, and whenever a style is selected
 * before pressing play.
 */
function previewChord() {
  if (!S.style) return;
  S.chord = buildChord(pick(S.style.progression));
  updateChordUI(S.chord);
}

/**
 * Switch musical style. While the instrument is playing, the change is
 * cross-faded: the master dips, the old voices are stopped, the new mood is
 * applied, and the master rises again. Paused, the switch is immediate because
 * there is nothing sounding to fade.
 *
 * @param {string} id style id from `STYLES`
 */
function setStyle(id) {
  if (!STYLE_MAP[id]) return;
  if (S.playing && S.styleId !== id) {
    crossfadeToStyle(id);
    return;
  }
  applyStyle(id);
}

/**
 * Audible hand-over between two moods. A single master bus cannot overlap old
 * and new material, so the instrument breathes instead: a short dip to silence
 * (the old tails fade under it), a clean state reset, then a ramp back up.
 * A token guards against rapid clicking through the style row.
 *
 * @param {string} id style id from `STYLES`
 */
function crossfadeToStyle(id) {
  if (!A.ctx) {
    applyStyle(id);
    return;
  }
  const token = ++styleFadeToken;
  const g = A.master.gain;
  const now = A.ctx.currentTime;
  g.cancelScheduledValues(now);
  g.setValueAtTime(Math.max(0.0001, g.value), now);
  g.exponentialRampToValueAtTime(0.0001, now + 0.28);
  // Keep the scheduler quiet during the dip so the new mood starts on a bar.
  S.transitioning = true;

  setTimeout(() => {
    if (token !== styleFadeToken) return;
    if (!S.playing) {
      S.transitioning = false;
      return;
    }
    stopAllVoices();
    stopVinyl();
    applyStyle(id);
    S.step = 0;
    S.forceChord = true;
    S.nextTime = A.ctx.currentTime + 0.05;
    S.transitioning = false;
    const t = A.ctx.currentTime;
    g.cancelScheduledValues(t);
    g.setValueAtTime(0.0001, t);
    g.exponentialRampToValueAtTime(0.9 * S.volume, t + 0.5);
  }, 300);
}

/**
 * Apply a style immediately: reset phrase state, update tempo and palette, and
 * synchronise the vinyl bed and room settings.
 *
 * @param {string} id style id from `STYLES`
 */
function applyStyle(id) {
  const st = STYLE_MAP[id];
  if (!st) return;
  const changed = S.styleId !== id;

  S.styleId = id;
  saveSetting(STORAGE_KEYS.styleId, S.styleId);
  S.style = st;
  S.bpm = st.bpm;
  // Persist the tempo the switch just applied: the saved value always mirrors
  // what the slider shows, so a reload restores this style's tempo, not the
  // previous style's.
  saveSetting(STORAGE_KEYS.tempo, S.bpm);
  // Space and density are part of the mood too, not global preferences: an
  // ambient piece opens the room and thins the texture, jazz tightens both.
  // Persisted like the tempo, so the stored values always describe the mood
  // that is actually selected and a reload restores its own settings.
  S.density = st.density == null ? S.density : st.density;
  S.space = st.space == null ? S.space : st.space;
  saveSetting(STORAGE_KEYS.density, S.density);
  saveSetting(STORAGE_KEYS.space, S.space);
  S.chordIndex = 0;
  S.arpIndex = 0;
  S.bassIndex = 0;
  S.melodyPrev = null;
  S.prevVoicing = null;
  S.chord = null;
  S.forceChord = true;

  if (S.playing) S.step = 0;

  els.tempo.value = st.bpm;
  els.tempoOut.textContent = st.bpm;
  setSliderFill(els.tempo);
  els.density.value = Math.round(S.density * 100);
  els.densityOut.textContent = els.density.value + "%";
  setSliderFill(els.density);
  els.space.value = Math.round(S.space * 100);
  els.spaceOut.textContent = els.space.value + "%";
  setSliderFill(els.space);
  els.styleLabel.textContent = st.name;
  els.blurb.textContent = st.blurb;

  for (const b of els.styleRow.children) {
    b.setAttribute("aria-pressed", String(b.dataset.style === id));
  }

  applyPalette(st);
  if (A.ctx) {
    updateSpace();
    // The vinyl bed belongs to playback, not to the preview state.
    if (S.playing) {
      if (st.vinyl) startVinyl();
      else stopVinyl();
    }
  }
  if (!S.playing) previewChord();
  else if (!changed) S.forceChord = true;
}

/**
 * Modulate to a random tonic. Only the key centre changes; the style's
 * mode and progression stay intact. The next chord is forced so the change
 * is audible immediately.
 */
function newKey() {
  S.root = 45 + Math.floor(Math.random() * 12);
  S.prevVoicing = null;
  S.melodyPrev = null;
  S.forceChord = true;
  if (!S.playing) previewChord();
}

/**
 * Ask the scheduler to advance harmony on its next tick. While paused,
 * preview the following chord instead.
 */
function skipChord() {
  S.forceChord = true;
  if (!S.playing) previewNext();
}

/**
 * Move through the style list in either direction, wrapping around.
 * @param {number} dir +1 or -1
 */
function cycleStyle(dir) {
  const i = STYLE_ORDER.findIndex((s) => s.id === S.styleId);
  const next = STYLE_ORDER[(i + dir + STYLE_ORDER.length) % STYLE_ORDER.length];
  setStyle(next.id);
}

/**
 * Build the voice a hand-played note uses, from the mood's own layers.
 *
 * The generated melody is a mood's foreground voice, so a pressed key copies
 * it first; moods without an audible melody fall through to the arpeggio,
 * then to comping chords, and finally to the pad. Duration, velocity and
 * level come from that layer unchanged, and the waveform is the mood's own
 * timbre, which is why a key press now sounds like the piece around it
 * instead of a separate preset that merely resembled it.
 *
 * @returns {{dur:number, vel:number, opts:object}}
 */
function tapVoice() {
  const st = S.style || STYLE_MAP.nocturne;
  const L = st.layers || {};
  // Melody is the foreground voice; the arpeggio and comping chords are the
  // fallbacks in that order, so a key press imitates whatever the mood is most
  // likely to be playing at that moment.
  for (const key of ["melody", "arp", "chord"]) {
    const layer = L[key];
    if (layer && (layer.prob || 0) > 0 && (layer.level || 0) > 0) {
      const opts = { timbre: st.timbre, level: layer.level, pan: 0 };
      // The scheduler's arpeggio voices carry a warm 2-cent detune; copy it so
      // a hand-played arp note is literally the same voice.
      if (key === "arp") opts.detune = 2;
      return {
        dur: layer.dur == null ? 1 : layer.dur,
        vel: layer.vel == null ? 0.4 : layer.vel,
        opts
      };
    }
  }
  // Pad-only moods: mirror how `advanceChord()` schedules the pad.
  const p = L.pad || {};
  return {
    dur: (st.chordSteps / 4) * (p.stretch || 1),
    vel: p.vel == null ? 0.3 : p.vel,
    opts: {
      timbre: "soft",
      level: p.level == null ? 0.3 : p.level,
      attack: p.attack,
      release: p.release,
      sustain: 0.72,
      detune: 5.5
    }
  };
}

/**
 * Play a single note from a click/tap on the on-screen keyboard. This is
 * also the most reliable way to unlock audio on mobile before pressing
 * play, so it explicitly resumes a suspended context.
 *
 * @param {number} midi
 */
async function tapKey(midi) {
  try {
    ensureAudio();
    if (A.ctx.state === "suspended") await A.ctx.resume();
    // Cancel a pending pause teardown and make sure the master is audible,
    // so tapping a key right after pressing pause still makes a sound.
    stopToken++;
    A.master.gain.setTargetAtTime(S.volume * 0.9, A.ctx.currentTime, 0.02);
    // A tap can follow a pause, where both wet returns are muted; bring them
    // back so the note gets its room instead of sounding bone dry.
    armTails();
    const v = tapVoice();
    playVoice(midi, A.ctx.currentTime + 0.01, v.dur, v.vel, v.opts);
  } catch (e) {
    /* Audio is an enhancement; ignore unsupported/blocked contexts. */
  }
}

/**
 * Advertise the piece as media, when the browser supports it. This is what
 * lets a phone show play/pause controls and treat the tab as an audio app.
 */
function setupMediaSession() {
  if (typeof navigator === "undefined" || !("mediaSession" in navigator)) return;
  try {
    if (typeof MediaMetadata !== "undefined") {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: "Infinite Keys",
        artist: "Generative piano",
        album: "Endless"
      });
    }
    navigator.mediaSession.setActionHandler("play", () => startMusic());
    navigator.mediaSession.setActionHandler("pause", () => stopMusic());
  } catch (e) {
    /* Media Session is optional. */
  }
}

/**
 * Start (or resume) the endless performance.
 *
 * Audio is created/resumed inside the click handler to satisfy autoplay
 * policy. The scheduler is reset to the top of a bar, the master fades in,
 * and a stop token invalidates any pending teardown from a previous pause.
 */
async function startMusic() {
  try {
    ensureAudio();
    if (A.ctx.state !== "running") await A.ctx.resume();
  } catch (e) {
    return;
  }
  if (S.playing) return;
  setupMediaSession();
  stopToken++;
  // A rapid stop/start can leave a long pad from the previous phrase alive;
  // clear the slate before the new downbeat.
  stopAllVoices();
  visual.length = 0;

  S.transitioning = false;
  S.playing = true;
  S.step = 0;
  S.chordIndex = 0;
  S.arpIndex = 0;
  S.bassIndex = 0;
  S.melodyPrev = null;
  S.forceChord = true;
  S.nextTime = A.ctx.currentTime + 0.06;

  const now = A.ctx.currentTime;
  A.master.gain.cancelScheduledValues(now);
  A.master.gain.setTargetAtTime(S.volume * 0.9, now, 0.03);
  armTails();
  if (S.style && S.style.vinyl) startVinyl();

  clearInterval(S.timer);
  S.timer = setInterval(tick, 25);
  tick();
  updateTransport();
}

/**
 * Pause without discarding the musical state.
 *
 * The master fades out over ~40 ms, then sources are stopped and the effect
 * tails are flushed. The master deliberately stays down: the reverb and delay
 * buses keep ringing after their inputs stop, so restoring the gain here would
 * make the last phrase's tail reappear out of an otherwise silent pause.
 * `startMusic()` and `tapKey()` raise it again. The token check prevents this
 * delayed teardown from cutting off notes if the user hits play again
 * immediately.
 */
function stopMusic() {
  if (!S.playing) return;
  S.playing = false;
  // Cancel any pending style hand-over so it cannot raise the master after a
  // pause/play cycle.
  S.transitioning = false;
  styleFadeToken++;
  const token = ++stopToken;
  clearInterval(S.timer);
  S.timer = null;
  visual.length = 0;

  if (A.ctx) {
    const now = A.ctx.currentTime;
    A.master.gain.cancelScheduledValues(now);
    A.master.gain.setTargetAtTime(0.0001, now, 0.035);
    setTimeout(() => {
      if (token !== stopToken) return;
      stopAllVoices();
      stopVinyl();
      flushTails();
    }, 190);
  }
  updateTransport();
}

/**
 * Single entry point shared by the transport button and the space bar.
 */
function togglePlay() {
  if (S.playing) stopMusic();
  else startMusic();
}

/**
 * Attach all UI behaviour once: style pills, transport, sliders, and the
 * keyboard shortcuts. Range inputs write directly into `S`; the scheduler
 * reads that state on every tick, so changes take effect without
 * rebuilding anything.
 */
function wireControls() {
  // Pills read as a slow-to-fast arc regardless of where a mood sits in the
  // array, so new entries can be appended together without breaking the flow.
  // Ids drive selection; declaration order has no other meaning.
  for (const st of STYLE_ORDER) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "style-btn";
    b.dataset.style = st.id;
    b.style.setProperty("--c", st.accent);
    b.innerHTML = '<span class="dot"></span><span>' + st.name + "</span>";
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => setStyle(st.id));
    els.styleRow.appendChild(b);
  }

  els.play.addEventListener("click", togglePlay);
  els.visualsBtn.addEventListener("click", () => setVisuals(!S.visuals));
  els.keyBtn.addEventListener("click", newKey);
  els.skipBtn.addEventListener("click", skipChord);
  if (els.themeBtn) els.themeBtn.addEventListener("click", () => setLight(!light));

  els.tempo.addEventListener("input", () => {
    S.bpm = Number(els.tempo.value);
    els.tempoOut.textContent = S.bpm;
    setSliderFill(els.tempo);
    saveSetting(STORAGE_KEYS.tempo, S.bpm);
  });

  els.density.addEventListener("input", () => {
    S.density = Number(els.density.value) / 100;
    els.densityOut.textContent = els.density.value + "%";
    setSliderFill(els.density);
    saveSetting(STORAGE_KEYS.density, S.density);
  });

  els.space.addEventListener("input", () => {
    S.space = Number(els.space.value) / 100;
    els.spaceOut.textContent = els.space.value + "%";
    setSliderFill(els.space);
    updateSpace();
    saveSetting(STORAGE_KEYS.space, S.space);
  });

  els.volume.addEventListener("input", () => {
    S.volume = Number(els.volume.value) / 100;
    els.volumeOut.textContent = els.volume.value + "%";
    setSliderFill(els.volume);
    saveSetting(STORAGE_KEYS.volume, S.volume);
    // Only touch the live gain while something is audible. Writing it during a
    // pause would raise the master onto the reverb tail the teardown muted.
    if (A.ctx && S.playing) {
      A.master.gain.setTargetAtTime(S.volume * 0.9, A.ctx.currentTime, 0.04);
    }
  });

  document.addEventListener("keydown", (e) => {
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") return;
    // Let a focused button keep its native Space/Enter activation.
    if ((tag === "button" || tag === "a") && (e.code === "Space" || e.key === "Enter")) return;
    if (e.code === "Space") {
      e.preventDefault();
      togglePlay();
    } else if (e.key === "ArrowRight") {
      e.preventDefault();
      cycleStyle(1);
    } else if (e.key === "ArrowLeft") {
      e.preventDefault();
      cycleStyle(-1);
    } else if (e.key === "k" || e.key === "K") {
      newKey();
    } else if (e.key === "s" || e.key === "S") {
      skipChord();
    } else if (e.key === "v" || e.key === "V") {
      setVisuals(!S.visuals);
    }
  });
}

/**
 * Diagnostics overlay, enabled by adding `?perf` to the URL. It exists so a
 * performance complaint can be measured instead of guessed at: rAF cadence,
 * scheduler tick lateness, long tasks, live voices and the look-ahead in use.
 * Without the flag `initPerf()` returns immediately and nothing is created.
 */
function initPerf() {
  if (!DIAG.perf) return;

  PERF.on = true;
  const panel = document.createElement("pre");
  panel.id = "perf";
  panel.setAttribute("aria-hidden", "true");
  document.body.appendChild(panel);
  PERF.panel = panel;

  // Long tasks are the clearest "the main thread was blocked" signal, but the
  // API is not universal; without it fps and tick drift still tell the story.
  if (typeof PerformanceObserver !== "undefined") {
    try {
      PERF.observer = new PerformanceObserver((list) => {
        for (const entry of list.getEntries()) PERF.longAt.push(entry.startTime);
      });
      PERF.observer.observe({ entryTypes: ["longtask"] });
    } catch (e) {
      PERF.observer = null;
    }
  }

  // Console snapshot: `IKPerf()` in DevTools. The overlay is only a view of
  // this same state.
  window.IKPerf = () => ({
    fps: PERF.fps,
    worstFrameMs: PERF.worstFrame,
    tickDriftMs: PERF.drift,
    worstTickDriftMs: PERF.worstDrift,
    longTasks: PERF.longAt.length,
    voices: A.sources.size,
    horizon: PERF.horizon,
    hidden: document.hidden,
    focused: typeof document.hasFocus === "function" ? document.hasFocus() : null,
    visuals: S.visuals,
    audio: A.ctx ? A.ctx.state : null,
    particles: particles.length,
    dpr: DPR,
    canvas: canvas.width + "x" + canvas.height,
    flags: ["noblur", "noaurora", "nofx"].filter((k) => DIAG[k])
      .concat(isFinite(DIAG.dpr) ? ["dpr=" + DIAG.dpr] : [])
  });

  PERF.sampleAt = performance.now();
  PERF.rafId = requestAnimationFrame(perfFrame);
  perfRender();
}

/**
 * Own rAF probe, separate from `draw()` so the frame rate can be read even in
 * minimal mode, where the canvas loop is deliberately not running.
 *
 * @param {number} ts rAF timestamp
 */
function perfFrame(ts) {
  if (!PERF.on) return;
  if (PERF.lastFrame) {
    const gap = ts - PERF.lastFrame;
    // A background tab suspends rAF completely; that gap is not a frame hitch.
    if (gap > PERF.worstFrame && gap < 5000) PERF.worstFrame = gap;
  }
  PERF.lastFrame = ts;
  PERF.frames++;
  if (ts - PERF.sampleAt >= 1000) {
    PERF.fps = PERF.frames * 1000 / (ts - PERF.sampleAt);
    PERF.frames = 0;
    PERF.sampleAt = ts;
    perfRender();
    PERF.worstFrame = 0;
    PERF.worstDrift = 0;
  }
  PERF.rafId = requestAnimationFrame(perfFrame);
}

/**
 * Record how late the 25 ms scheduler interval actually fired. This is the
 * honest main-thread-busy signal: the timer is cheap, so lateness means the
 * browser had something else to do first.
 */
function perfTick() {
  if (!PERF.on) return;
  const now = performance.now();
  // The first tick after play (or after a pause) has no meaningful interval.
  if (PERF.lastTick && now - PERF.lastTick < 200) {
    const drift = Math.max(0, now - PERF.lastTick - 25);
    PERF.drift = PERF.drift ? PERF.drift * 0.9 + drift * 0.1 : drift;
    if (drift > PERF.worstDrift) PERF.worstDrift = drift;
  }
  PERF.lastTick = now;
}

/** Repaint the overlay text. Called at most once per second. */
function perfRender() {
  if (!PERF.panel) return;
  const now = performance.now();
  while (PERF.longAt.length && PERF.longAt[0] < now - 5000) PERF.longAt.shift();
  const audio = A.ctx ? A.ctx.state : "none";
  const focus = typeof document.hasFocus === "function"
    ? (document.hasFocus() ? "focused" : "unfocused")
    : "?";
