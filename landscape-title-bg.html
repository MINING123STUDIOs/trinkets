  },
  // orthogonal: straight, axis-aligned fissure hallways — the phreatic stage of
  // a limestone cave, before anything starts to meander. It is a field of
  // RANDOM STRAIGHT LINES, not a lattice: each axis is cut into a grid of bands,
  // B cells wide across a line and L cells long along it, and every band draws
  // one line. A line's offset inside its band, its start and its length are
  // hashed per band, and the offset never varies along the run — so every line

  // somewhere else rather than the old one displaced sideways.

  // one-cell geometry describes the lines, not every open cell in the world.

  underground: (x, y, s) => {
